name: CIAgent — Demo Agent Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'examples/dev-agent/**'
      - 'examples/rag-agent/**'
      - 'examples/support-router/**'
      - '.github/workflows/**'

jobs:
  agentci-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/dev-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ciagent
        run: |
          pip install --upgrade pip
          # Install the latest ciagent directly from GitHub
          pip install git+https://github.com/suniel12/ciagent.git@main

      - name: Install devagent dependencies
        run: |
          pip install anthropic httpx python-dotenv pytest pytest-asyncio pytest-anyio

      - name: Install devagent in editable mode
        run: pip install -e .

      - name: Run deterministic CIAgent tests (dev-agent)
        run: |
          pytest tests/ -v -m "not live" \
            --tb=short \
            2>&1 | tee ciagent-test-results.txt
        env:
          ANTHROPIC_API_KEY: sk-ant-dummy-key-for-testing

      - name: Run deterministic CIAgent tests (rag-agent)
        run: |
          cd ../rag-agent
          pytest tests/ -v \
            --tb=short \
            2>&1 | tee rag-test-results.txt
        env:
          OPENAI_API_KEY: sk-dummy-openai-key
          ANTHROPIC_API_KEY: sk-ant-dummy-key-for-testing

      - name: Run LLM-as-judge tests (requires API key secret)
        # The real ANTHROPIC_API_KEY must be set as a repo secret.
        # When it is not (e.g. in forked PRs), this step runs but the test
        # auto-skips via the check inside test_output_quality.py.
        run: |
          pytest tests/test_output_quality.py::TestLLMAsJudge -v \
            --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_DEVAGENT }}
        continue-on-error: false  # LLM judge failures count as CI failures

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciagent-test-results
          path: examples/dev-agent/ciagent-test-results.txt
          retention-days: 14

  support-router-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/support-router

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ciagent
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/suniel12/ciagent.git@main

      - name: Install support-router dependencies
        run: |
          pip install openai-agents pydantic python-dotenv pytest pyyaml

      - name: Install support-router in editable mode
        run: pip install -e .

      - name: Run mock tests (no API key needed)
        run: |
          pytest tests/ -v --tb=short \
            2>&1 | tee support-router-test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-router-test-results
          path: examples/support-router/support-router-test-results.txt
          retention-days: 14
