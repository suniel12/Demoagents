[project]
name = "support-router"
version = "0.1.0"
description = "Multi-agent customer support router — CIAgent demo using OpenAI Agents SDK"
requires-python = ">=3.10"

dependencies = [
    "openai-agents>=0.0.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "ciagent[openai]>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
